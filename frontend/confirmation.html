<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation — FIMPISAVA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/confirmation.css">
    <link rel="icon" type="image/jpg" href="images/logo.jpg">
</head>
<body>

    <header class="mini-header">
        <a href="index.html" class="mini-logo">
            <img src="images/logo.jpg" alt="Logo FIMPISAVA">
            <div class="logo-text">
                <span>FIMPISAVA</span>
                <small>Fikambanana Mpianatra SAVA</small>
            </div>
        </a>
    </header>

    <main class="confirmation-page">
        <div class="confirmation-card">
            <div class="check-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <h1 id="confirmation-title">C'est enregistré !</h1>
            <p id="confirmation-text">
                Merci, votre demande a bien été prise en compte par FIMPISAVA.
            </p>

            <div class="close-note">
                <i class="fa-regular fa-circle-check"></i>
                Vous pouvez fermer cette page en toute sécurité, ou revenir à l'accueil.
            </div>
        </div>
    </main>

    <footer class="mini-footer">
        <p>© 2026 FIMPISAVA — Fikambanana Mpianatra SAVA</p>
    </footer>

    <script src="js/confirmation.js"></script>

</body>
</html>
